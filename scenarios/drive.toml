# Drive scenario profile: bench a real rear drive inverter (DIR/PMR).
#
#   python scripts/vehicle_sim.py --config scenarios/drive.toml --channel can0 --party-channel can1
#
# The rear inverter hardware is physically connected, so mark it `real` -> the sim does NOT
# transmit its IDs (DI/DIR/PMR frames) and won't collide with the real device. Everything
# else (BMS/VCFRONT/CP/brake/immobilizer/UI/...) is simulated to bring the inverter out of MIA
# and answer the immobilizer, exactly as before. (With NO inverter connected you'd drop this
# `real` list and the sim would broadcast a virtual inverter too.)

# Target firmware revision for the message layouts. Each node transmits the newest set it has
# authored at/below this, falling back to the last version for which it has messages. Omit (or
# comment out) to use each node's newest authored set; --fw on the CLI overrides this.
#
# Pinned to the bench unit's firmware (gen-26 12603 running 2022.45.15, ../tesla-fw). This is
# NOT a no-op any more: DAS/BMS/CMP/APP/UI/EPAS3P/IBST/CP each author a 2022.45.15 set that adds
# IDs the 2020 DIR did not subscribe to (0x289 0x39B 0x452 0x2A7 0x25C 0x25D 0x3B3) and re-homes
# IBST_status 0x39D onto bus A. Drop the pin only to bench a 2020-era inverter.
[firmware]
version = "2022.45.15"

[nodes]
real = ["DI", "DIR", "PMR"]
# A RWD car has no front drive unit at all -- `absent`, not `real`: nothing on the bus sources its
# frames. Both halves of it, since the front is one unit running two cores (DIF = CPU2, PMF = CPU1).
# A RWD ("Single") rear subscribes to none of their IDs anyway, so simulating them would only add
# unhandled traffic. The same two nodes are `real` on a bench that has a physical front
# (scenarios/drive-awd-both.toml) and simulated on one that doesn't (scenarios/drive-awd.toml).
absent = ["DIF", "PMF"]

# Car config must match the unit under test: a RWD rear is selected by drivetrainType=RWD, and
# the rear/front pairing + several DIR behaviours key off it. Both of these are already the GTW
# node's defaults -- stated explicitly so the RWD bench and the AWD one differ visibly in one
# place rather than by omission.
[scenario.GTW]
drivetrain_type = "RWD"
chassis_type = "3_CHASSIS"   # Model 3; Y_CHASSIS for a Model Y

# VCFRONT already defaults to drive power; set it explicitly for clarity. Command a gear with
# e.g.  [scenario.SCCM]  gear = "D"  (held at standstill; watch DI_gear on 0x118).
[scenario.VCFRONT]
lv_power_state = "drive"

# All four wheels follow DIR_axleSpeed, as if driving: with traction control on, zero wheel speeds
# under a spinning motor trip active damping (DIR_a014) and the VDC (DI_a199/a200/a215/a232).
[scenario.ESP]
brake = "released"         # all three brake sources agree (IBST/VCLEFT below)
wheel_speeds = "road"
forward_direction = 0      # 0x155 wheel direction code rolling forward: 0 or 2 (backward = 1)

[scenario.IBST]
brake = "released"

[scenario.VCLEFT]
brake_switch_pressed = false  # must agree with ESP/IBST; the dashboard brake toggles all three

[scenario.DAS]
acc_state = "ACC_CANCEL_GENERIC_SILENT"   # manual control; "ACC_ON" claims cruise (acted on only with GTW autopilot != NONE)

# BMS_maxChargeCurrent caps regen current; 0 (the default) = no regen, safe on a PSU that can't
# sink current. Raise it only with a pack or a sinking supply, and keep it within the supply's sink
# rating: regen faster than the supply absorbs spikes the bus (DI_a021, then DIR_a021 HW bus OV).
# BMS_maxBusVoltage is the DI's regen voltage ceiling (default 400 V): set it a little above the
# supply voltage. BMS_maxRegenPower (default 60 kW) caps regen power.
# Discharge limits (defaults 500 A / 150 kW) should match the supply: drawing past its current
# limit sags the bus and it overshoots on recovery (DIR_a021 HW bus OV on acceleration).
# Conservative bench defaults for a ~350 V lab supply of unknown rating; raise from the dash.
# Discharge power stays >= 2 kW (below it the DI raises a125 noBatteryPower).
[scenario.BMS]
max_charge_current = 0       # A  (no regen until the bus is clamped in hardware)
max_regen_power = 0.5        # kW
max_bus_voltage = 370        # V
max_discharge_current = 10   # A
max_discharge_power = 3      # kW

# UI_regenTorqueMax (%, 5 % steps) scales lift-off regen torque and the DI's regen demand (~64 kW
# at 100 %). DI_a201 decelTorqueLimited holds while BMS regen power < 0.85 x demand; keep
# 0.85 x 64 kW x pct below max_regen_power (e.g. 10 % -> ~5.4 kW).
[scenario.UI]
regen_torque_max = 10

# RCM_verticalAccel is gravity-compensated (0, the default): +/-9.81 trips DI_a216 VERT_ACCEL.
# [scenario.RCM]
# vertical_accel = 0
