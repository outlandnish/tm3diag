<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAN Live Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --panel: #18181c;
    --border: #2a2a32;
    --accent: #e31937;
    --accent-dim: #8a0f20;
    --text: #e8e8ec;
    --text-dim: #7a7a88;
    --green: #22c55e;
    --yellow: #f59e0b;
    --flash: #3a3a10;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Mono', monospace;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ---- tab bar ---- */
  #tab-bar {
    display: flex;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .tab-btn {
    padding: 10px 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .08em;
    transition: color .1s, border-color .1s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ---- shared layout ---- */
  .tab-view {
    display: none;
    flex: 1;
    overflow: hidden;
  }
  .tab-view.active {
    display: flex;
  }

  /* ---- sidebar (shared) ---- */
  .sidebar {
    width: 200px;
    min-width: 160px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 14px 12px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
  }

  .sidebar-header span {
    display: block;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    text-transform: none;
    letter-spacing: 0;
    margin-bottom: 2px;
  }

  .node-list {
    overflow-y: auto;
    flex: 1;
    padding: 6px 0;
  }

  .node-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 7px 14px;
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font: inherit;
    border-left: 3px solid transparent;
    transition: background .1s, border-color .1s;
  }
  .node-btn:hover { background: rgba(255,255,255,.04); }
  .node-btn.active {
    background: rgba(227,25,55,.1);
    border-left-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .msg-list { display: none; }
  .msg-list.open { display: block; }

  .msg-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 4px 14px 4px 22px;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    transition: background .1s, color .1s;
  }
  .msg-btn:hover { background: rgba(255,255,255,.04); color: var(--text); }
  .msg-btn .msg-btn-id { color: var(--text-dim); font-size: 10px; margin-left: 4px; }

  /* ---- main area ---- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .node-section-header {
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    padding: 16px 0 6px;
    border-bottom: 2px solid var(--accent-dim);
    margin-bottom: 4px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 2;
  }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
  }
  #status-dot.connected { background: var(--green); }
  #status-dot.error     { background: var(--accent); }

  #status-text { color: var(--text-dim); font-size: 12px; }

  .filter-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    color: var(--text);
    font: inherit;
    width: 180px;
  }
  .filter-input:focus { outline: none; border-color: var(--accent-dim); }

  #fps-counter {
    color: var(--text-dim);
    font-size: 11px;
    min-width: 60px;
    text-align: right;
  }

  #alert-filter-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    color: var(--text-dim);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .1s, color .1s, border-color .1s;
  }
  #alert-filter-btn:hover { color: var(--text); border-color: var(--accent-dim); }
  #alert-filter-btn.active {
    background: rgba(227,25,55,.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---- signal table (live) ---- */
  .table-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 0 18px 18px;
  }

  .msg-section { margin-top: 16px; }

  .msg-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 5px 0 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }

  .msg-name { font-weight: 600; font-size: 12px; }
  .msg-id   { color: var(--text-dim); font-size: 11px; }
  .msg-age  {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    min-width: 60px;
    text-align: right;
  }
  .msg-age.stale { color: var(--accent); }

  table { width: 100%; border-collapse: collapse; }

  td {
    padding: 3px 6px;
    border-bottom: 1px solid rgba(255,255,255,.03);
    vertical-align: middle;
  }

  .sig-name  { color: var(--text-dim); width: 55%; }
  .sig-value { font-weight: 600; font-size: 13px; transition: background .05s; }
  .sig-value.flash { background: var(--flash); }
  .sig-units { color: var(--text-dim); font-size: 11px; padding-left: 4px; }
  .sig-label { color: var(--yellow); font-size: 11px; padding-left: 4px; }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: var(--text-dim);
  }
  .placeholder .big { font-size: 38px; }

  /* ---- explorer tab ---- */
  #exp-search-bar {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  #exp-search {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  #exp-search:focus { outline: none; border-color: var(--accent-dim); }

  #exp-count {
    color: var(--text-dim);
    font-size: 11px;
    white-space: nowrap;
  }

  #exp-results {
    flex: 1;
    overflow-y: auto;
    padding: 0 18px 18px;
  }

  .exp-msg-section { margin-top: 16px; }

  .exp-node-tag {
    margin-left: auto;
    font-size: 10px;
    color: var(--text-dim);
    background: rgba(255,255,255,.05);
    border-radius: 3px;
    padding: 1px 5px;
  }

  .exp-sig-row { display: flex; gap: 8px; padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,.03); }
  .exp-sig-row.hidden { display: none; }
  .exp-sig-name { flex: 1; color: var(--text-dim); }
  .exp-sig-units { color: var(--text-dim); font-size: 11px; min-width: 40px; }
  .exp-sig-values { color: var(--yellow); font-size: 11px; }

  .exp-node-sidebar .node-btn { font-size: 12px; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ---- raw frames tab ---- */
  #tab-raw {
    flex-direction: row;
  }

  #raw-topbar {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    background: var(--panel);
  }

  #raw-id-filter {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    color: var(--text);
    font: inherit;
    width: 140px;
  }
  #raw-id-filter:focus { outline: none; border-color: var(--accent-dim); }

  #raw-id-filter::placeholder { color: var(--text-dim); }

  .raw-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 12px;
    color: var(--text-dim);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    transition: background .1s, color .1s, border-color .1s;
  }
  .raw-btn:hover { color: var(--text); border-color: var(--accent-dim); }
  .raw-btn.active {
    background: rgba(227,25,55,.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  #raw-status {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #raw-status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #444;
    flex-shrink: 0;
  }
  #raw-status-dot.connected { background: var(--green); }
  #raw-status-dot.error     { background: var(--accent); }

  #raw-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #raw-cards-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 20px;
  }

  /* grid of cards */
  #raw-cards-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-content: flex-start;
  }

  .raw-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    min-width: 260px;
    flex: 0 0 auto;
  }

  .raw-card-header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
  }

  .raw-card-id {
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
    letter-spacing: .04em;
  }

  .raw-card-name {
    font-size: 11px;
    color: var(--text-dim);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .raw-card-rate {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .raw-bytes-row {
    display: flex;
    gap: 4px;
  }

  .raw-byte-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 5px 4px 4px;
    border-radius: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    min-width: 28px;
    transition: background 0.2s ease;
  }

  .raw-byte-box.byte-flash {
    background: var(--yellow) !important;
    transition: background 0s;
  }

  .raw-byte-hex {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: .04em;
    line-height: 1;
  }

  .raw-bits-row {
    display: flex;
    gap: 2px;
  }

  .raw-bit {
    width: 8px;
    height: 8px;
    border-radius: 1px;
    background: var(--border);
    transition: background 0.2s ease;
  }
  .raw-bit.on { background: var(--accent); }
  .raw-bit.bit-flash { background: var(--green) !important; transition: background 0s; }

  /* ---- raw sidebar ---- */
  #raw-sidebar {
    width: 160px;
    min-width: 140px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  #raw-sidebar-header {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  #raw-sidebar-actions {
    display: flex;
    gap: 6px;
  }

  .raw-sidebar-action {
    background: none;
    border: none;
    color: var(--text-dim);
    font: inherit;
    font-size: 10px;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
  }
  .raw-sidebar-action:hover { color: var(--text); }

  #raw-id-list {
    overflow-y: auto;
    flex: 1;
    padding: 4px 0;
  }

  .raw-id-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    cursor: pointer;
    user-select: none;
  }
  .raw-id-row:hover { background: rgba(255,255,255,.04); }

  .raw-id-row input[type=checkbox] {
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }

  .raw-id-row-label {
    font-size: 12px;
    color: var(--text);
    flex: 1;
    font-family: inherit;
  }

  .raw-id-row-rate {
    font-size: 10px;
    color: var(--text-dim);
    min-width: 28px;
    text-align: right;
  }

  #raw-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
</style>
</head>
<body>

<!-- Tab bar -->
<div id="tab-bar">
  <button class="tab-btn active" data-tab="live">Live</button>
  <button class="tab-btn" data-tab="explorer">DB Explorer</button>
  <button class="tab-btn" data-tab="raw">Raw Frames</button>
</div>

<!-- ===================== LIVE TAB ===================== -->
<div id="tab-live" class="tab-view active">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>CAN Live Viewer</span>
      ECU nodes
    </div>
    <div id="node-list" class="node-list"><div style="padding:12px;color:var(--text-dim)">Connecting…</div></div>
  </div>

  <div class="main">
    <div class="topbar">
      <input id="filter-input" class="filter-input" type="text" placeholder="Filter signals…">
      <button id="alert-filter-btn">Active alerts only</button>
      <div id="fps-counter"></div>
      <div id="status-dot"></div>
      <div id="status-text">disconnected</div>
    </div>
    <div id="table-wrap" class="table-wrap">
      <div id="placeholder" class="placeholder">
        <div>Choose an ECU node from the sidebar</div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== RAW FRAMES TAB ===================== -->
<div id="tab-raw" class="tab-view">
  <div id="raw-sidebar">
    <div id="raw-sidebar-header">
      IDs
      <div id="raw-sidebar-actions">
        <button class="raw-sidebar-action" id="raw-show-all">all</button>
        <button class="raw-sidebar-action" id="raw-hide-all">none</button>
      </div>
    </div>
    <div id="raw-id-list"></div>
  </div>
  <div id="raw-body">
    <div id="raw-topbar">
      <input id="raw-id-filter" type="text" placeholder="Filter by ID (hex)…">
      <button id="raw-clear-btn" class="raw-btn">Clear</button>
      <button id="raw-freeze-btn" class="raw-btn">Freeze</button>
      <div id="raw-status">
        <div id="raw-status-dot"></div>
        <span id="raw-status-text">disconnected</span>
      </div>
    </div>
    <div id="raw-cards-wrap">
      <div id="raw-cards-grid"></div>
    </div>
  </div>
</div>

<!-- ===================== EXPLORER TAB ===================== -->
<div id="tab-explorer" class="tab-view">
  <div class="sidebar exp-node-sidebar">
    <div class="sidebar-header">
      <span>Explorer</span>
      ECU nodes
    </div>
    <div id="exp-node-list" class="node-list"><div style="padding:12px;color:var(--text-dim)">Loading…</div></div>
  </div>

  <div class="main">
    <div id="exp-search-bar">
      <input id="exp-search" type="text" placeholder="Search signals, messages…">
      <div id="exp-count"></div>
    </div>
    <div id="exp-results">
      <div class="placeholder">
        <div class="big">🔍</div>
        <div>Select a node or search to browse signals</div>
      </div>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  WS_URL:              `ws://${location.host}/ws`,
  API_DB:              '/api/db',
  RECONNECT_MS:        1500,
  FPS_INTERVAL_MS:     1000,
  AGE_INTERVAL_MS:     250,
  FLASH_MS:            300,
  STALE_MULTIPLIER:    3,
  ALERT_RE:            /_a\d{3}_/,
  CHAR_RE:             /^(.+)Char(\d+)$/,
};

// ===========================================================
// Tab switching
// ===========================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.tab-view').forEach(v => v.classList.toggle('active', v.id === `tab-${tab}`));
    if (tab === 'explorer' && !expLoaded) loadExplorer();
  });
});

// ===========================================================
// LIVE TAB
// ===========================================================
let ws = null;
const msgState   = new Map();
const msgDom     = new Map();
let frameCount = 0;
let lastFpsTs  = performance.now();

const nodeList      = document.getElementById('node-list');
const tableWrap     = document.getElementById('table-wrap');
const placeholder   = document.getElementById('placeholder');
const filterInput   = document.getElementById('filter-input');
const alertFilterBtn = document.getElementById('alert-filter-btn');
const statusDot     = document.getElementById('status-dot');
const statusText    = document.getElementById('status-text');
const fpsCounter    = document.getElementById('fps-counter');

let alertFilterActive = false;

function connect() {
  ws = new WebSocket(CONFIG.WS_URL);
  ws.onopen = () => {
    statusDot.className = 'connected';
    statusText.textContent = 'connected';
    subscribe('');
  };
  ws.onclose = () => {
    statusDot.className = '';
    statusText.textContent = 'reconnecting…';
    setTimeout(connect, CONFIG.RECONNECT_MS);
  };
  ws.onerror = () => {
    statusDot.className = 'error';
    statusText.textContent = 'error';
  };
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if      (msg.type === 'db')    handleDb(msg);
      else if (msg.type === 'frame') handleFrame(msg);
    } catch (e) {
      console.error('Failed to parse WebSocket message:', e);
    }
  };
}

async function handleDb(msg) {
  nodeList.innerHTML = '';
  msg.nodes.forEach(node => {
    const item = document.createElement('div');

    const btn = document.createElement('button');
    btn.className = 'node-btn';
    btn.textContent = node;
    btn.addEventListener('click', () => selectNode(node));

    const msgList = document.createElement('div');
    msgList.className = 'msg-list';
    msgList.dataset.node = node;

    item.appendChild(btn);
    item.appendChild(msgList);
    nodeList.appendChild(item);
  });

  try {
    const res = await fetch(CONFIG.API_DB);
    const db = await res.json();
    msgState.clear();
    msgDom.clear();
    tableWrap.innerHTML = '';

    msg.nodes.forEach(node => {
      const messages = db[node];
      if (!messages || messages.length === 0) return;

      const sectionHeader = document.createElement('div');
      sectionHeader.className = 'node-section-header';
      sectionHeader.id = `node-${node}`;
      sectionHeader.textContent = node;
      tableWrap.appendChild(sectionHeader);

      const msgList = nodeList.querySelector(`.msg-list[data-node="${node}"]`);
      messages.forEach(m => {
        msgState.set(m.id, { name: m.name, lastTs: null, cycleTime: m.cycle_time || 0, signals: {} });
        m.signals.forEach(s => {
          msgState.get(m.id).signals[s.name] = { value: '—', label: null, units: s.units };
        });
        buildMsgSection(m);

        if (msgList) {
          const mb = document.createElement('button');
          mb.className = 'msg-btn';
          mb.innerHTML = `${m.name}<span class="msg-btn-id">0x${m.id.toString(16).toUpperCase().padStart(3,'0')}</span>`;
          mb.addEventListener('click', () => scrollToMsg(m.id));
          msgList.appendChild(mb);
        }
      });
    });

    const hasAlerts = [...msgState.values()].some(s =>
      Object.keys(s.signals).some(sig => CONFIG.ALERT_RE.test(sig))
    );
    alertFilterBtn.style.display = hasAlerts ? '' : 'none';
    applyFilter();
  } catch (e) {
    tableWrap.innerHTML = `<div class="placeholder"><div>Failed to load DB schema</div></div>`;
  }
}

function handleFrame(msg) {
  frameCount++;
  const state = msgState.get(msg.msg_id);
  if (!state) return;
  state.lastTs = msg.timestamp;
  const dom = msgDom.get(msg.msg_id);
  const updatedPrefixes = new Set();

  msg.signals.forEach(s => {
    const cur = state.signals[s.signal];
    if (!cur) return;
    const changed = cur.value !== s.value || cur.label !== s.label;
    cur.value = s.value;
    cur.label = s.label || null;
    if (!dom) return;
    const row = dom.rows[s.signal];
    if (!row) return;
    const formatted = (s.label && !s.units) ? s.label : formatValue(s.value, s.units);
    if (row.valueTd.textContent !== formatted) {
      row.valueTd.textContent = formatted;
      if (changed) flashCell(row.valueTd);
    }
    row.labelTd.textContent = (s.label && !s.units) ? '' : (s.label || '');

    const m = CONFIG.CHAR_RE.exec(s.signal);
    if (m) updatedPrefixes.add(m[1]);
  });

  if (dom) {
    updatedPrefixes.forEach(prefix => {
      const key = `__str__${prefix}`;
      const row = dom.rows[key];
      if (!row) return;
      const str = assembleString(prefix, row.charGroup, state);
      if (row.valueTd.textContent !== str) {
        row.valueTd.textContent = str;
        flashCell(row.valueTd);
      }
    });
  }

  if (alertFilterActive) applyFilter();
}

function buildMsgSection(m) {
  const section = document.createElement('div');
  section.className = 'msg-section';
  section.dataset.msgId = m.id;

  const header = document.createElement('div');
  header.className = 'msg-header';

  const nameEl = document.createElement('span');
  nameEl.className = 'msg-name';
  nameEl.textContent = m.name;

  const idEl = document.createElement('span');
  idEl.className = 'msg-id';
  idEl.textContent = `0x${m.id.toString(16).toUpperCase().padStart(3,'0')}`;

  const ageEl = document.createElement('span');
  ageEl.className = 'msg-age';
  ageEl.textContent = '—';

  header.append(nameEl, idEl, ageEl);
  section.appendChild(header);

  const table = document.createElement('table');
  const rows  = {};
  const charGroups = charGroupsForMessage(m.signals);
  const hiddenSigs = new Set();
  charGroups.forEach(members => members.forEach(({ name }) => hiddenSigs.add(name)));

  // Synthetic string rows first
  charGroups.forEach((members, prefix) => {
    const tr = document.createElement('tr');
    tr.dataset.signal = `__str__${prefix}`;
    const nameTd  = document.createElement('td'); nameTd.className  = 'sig-name';  nameTd.textContent  = prefix;
    const valueTd = document.createElement('td'); valueTd.className = 'sig-value'; valueTd.textContent = '—';
    valueTd.style.fontFamily = 'inherit';
    const unitsTd = document.createElement('td'); unitsTd.className = 'sig-units';
    const labelTd = document.createElement('td'); labelTd.className = 'sig-label';
    tr.append(nameTd, valueTd, unitsTd, labelTd);
    table.appendChild(tr);
    rows[`__str__${prefix}`] = { tr, valueTd, labelTd, charGroup: members };
  });

  m.signals.forEach(s => {
    const sigName = s.name || s.signal;
    const tr = document.createElement('tr');
    tr.dataset.signal = sigName;
    if (hiddenSigs.has(sigName)) tr.style.display = 'none';

    const nameTd  = document.createElement('td'); nameTd.className  = 'sig-name';  nameTd.textContent  = sigName;
    const valueTd = document.createElement('td'); valueTd.className = 'sig-value'; valueTd.textContent = '—';
    const unitsTd = document.createElement('td'); unitsTd.className = 'sig-units'; unitsTd.textContent = s.units || '';
    const labelTd = document.createElement('td'); labelTd.className = 'sig-label';

    tr.append(nameTd, valueTd, unitsTd, labelTd);
    table.appendChild(tr);
    rows[sigName] = { tr, valueTd, labelTd };
  });

  section.appendChild(table);
  tableWrap.appendChild(section);
  msgDom.set(m.id, { section, ageEl, rows, charGroups });
}

setInterval(() => {
  const now = Date.now() / 1000;
  msgDom.forEach((dom, id) => {
    const state = msgState.get(id);
    if (!state || state.lastTs === null) return;
    const age = now - state.lastTs;
    dom.ageEl.textContent = age < 10 ? `${age.toFixed(1)}s` : `${age.toFixed(0)}s`;
    const staleThreshold = state.cycleTime ? (state.cycleTime * CONFIG.STALE_MULTIPLIER) / 1000 : 1.0;
    dom.ageEl.className = 'msg-age' + (age > staleThreshold ? ' stale' : '');
  });
}, CONFIG.AGE_INTERVAL_MS);

setInterval(() => {
  const now = performance.now();
  const elapsed = (now - lastFpsTs) / 1000;
  fpsCounter.textContent = `${(frameCount / elapsed).toFixed(0)} fps`;
  frameCount = 0;
  lastFpsTs  = now;
}, CONFIG.FPS_INTERVAL_MS);

filterInput.addEventListener('input', applyFilter);

alertFilterBtn.addEventListener('click', () => {
  alertFilterActive = !alertFilterActive;
  alertFilterBtn.classList.toggle('active', alertFilterActive);
  applyFilter();
});

let _filterTermCache = { raw: null, terms: [] };

function makeFilterTerms(raw) {
  if (raw === _filterTermCache.raw) return _filterTermCache.terms;
  const terms = raw.split(',').map(t => {
    const s = t.trim().toLowerCase();
    if (!s) return null;
    return new RegExp(s.split('*').map(p => p.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('.*'));
  }).filter(Boolean);
  _filterTermCache = { raw, terms };
  return terms;
}

function applyFilter() {
  const terms = makeFilterTerms(filterInput.value);
  msgDom.forEach((dom, id) => {
    const state = msgState.get(id);
    let msgVisible = false;
    Object.entries(dom.rows).forEach(([sig, { tr }]) => {
      const isStrRow = sig.startsWith('__str__');
      const isCharRow = CONFIG.CHAR_RE.test(sig);
      if (isCharRow) {
        tr.style.display = 'none';
        return;
      }
      const label = (isStrRow ? sig.replace('__str__', '') : sig).toLowerCase();
      const matchesText = terms.length === 0 || terms.some(re => re.test(label));

      let matchesAlert = true;
      if (alertFilterActive && CONFIG.ALERT_RE.test(sig) && state) {
        const sigState = state.signals[sig];
        matchesAlert = sigState ? (sigState.value === 1 || sigState.value === '1') : false;
      } else if (alertFilterActive && CONFIG.ALERT_RE.test(sig)) {
        matchesAlert = false;
      }

      const show = matchesText && matchesAlert;
      tr.style.display = show ? '' : 'none';
      if (show) msgVisible = true;
    });
    dom.section.style.display = msgVisible ? '' : 'none';
  });
}

function selectNode(node) {
  document.querySelectorAll('#node-list .node-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === node);
  });
  document.querySelectorAll('#node-list .msg-list').forEach(l => {
    l.classList.toggle('open', l.dataset.node === node);
  });
  const target = document.getElementById(`node-${node}`);
  if (target) {
    const next = target.nextElementSibling;
    const top = (next ? next.offsetTop : target.offsetTop) - tableWrap.offsetTop - target.getBoundingClientRect().height;
    tableWrap.scrollTo({ top, behavior: 'smooth' });
  }
}

function scrollToMsg(msgId) {
  const dom = msgDom.get(msgId);
  if (!dom) return;
  const nodeHeader = dom.section.previousElementSibling?.classList.contains('node-section-header')
    ? dom.section.previousElementSibling
    : dom.section.parentElement?.previousElementSibling;
  const stickyHeight = nodeHeader ? nodeHeader.getBoundingClientRect().height : 0;
  const top = dom.section.offsetTop - tableWrap.offsetTop - stickyHeight;
  tableWrap.scrollTo({ top, behavior: 'smooth' });
}

function subscribe(node) {
  ws.send(JSON.stringify({ type: 'subscribe', node }));
}

function charGroupsForMessage(signals) {
  const groups = new Map();
  signals.forEach(s => {
    const sigName = s.name || s.signal || s;
    const m = CONFIG.CHAR_RE.exec(sigName);
    if (!m) return;
    const prefix = m[1];
    if (!groups.has(prefix)) groups.set(prefix, []);
    groups.get(prefix).push({ name: sigName, idx: parseInt(m[2], 10) });
  });
  groups.forEach(arr => arr.sort((a, b) => a.idx - b.idx));
  return groups;
}

function assembleString(prefix, signals, state) {
  const chars = [];
  for (const { name } of signals) {
    const v = state.signals[name]?.value;
    const code = typeof v === 'number' ? v : parseInt(v, 10);
    if (!code) break; // null terminator
    chars.push(String.fromCharCode(code));
  }
  return chars.join('') || '—';
}

function formatValue(v, _units) {
  if (typeof v === 'number') {
    return Number.isInteger(v) ? String(v) : v.toFixed(4).replace(/\.?0+$/, '');
  }
  return String(v);
}

function flashCell(td) {
  td.classList.remove('flash');
  void td.offsetWidth;
  td.classList.add('flash');
  setTimeout(() => td.classList.remove('flash'), CONFIG.FLASH_MS);
}

connect();

// EXPLORER TAB
// ===========================================================
let expLoaded   = false;
let expDb       = {};      // node -> [ { id, name, signals: [{name, units, values}] } ]
let expActiveNode = null;  // null = show all

const expNodeList = document.getElementById('exp-node-list');
const expSearch   = document.getElementById('exp-search');
const expResults  = document.getElementById('exp-results');
const expCount    = document.getElementById('exp-count');

async function loadExplorer() {
  expLoaded = true;
  try {
    const res = await fetch(CONFIG.API_DB);
    expDb = await res.json();
    buildExpNodeList();
    renderExp();
  } catch (e) {
    expNodeList.innerHTML = `<div style="padding:12px;color:var(--accent)">Failed to load DB</div>`;
  }
}

function buildExpNodeList() {
  expNodeList.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'node-btn active';
  allBtn.textContent = 'All nodes';
  allBtn.addEventListener('click', () => selectExpNode(null));
  expNodeList.appendChild(allBtn);

  Object.keys(expDb).sort().forEach(node => {
    const btn = document.createElement('button');
    btn.className = 'node-btn';
    btn.textContent = node;
    btn.addEventListener('click', () => selectExpNode(node));
    expNodeList.appendChild(btn);
  });
}

function selectExpNode(node) {
  expActiveNode = node;
  document.querySelectorAll('#exp-node-list .node-btn').forEach(b => {
    const matches = node === null ? b.textContent === 'All nodes' : b.textContent === node;
    b.classList.toggle('active', matches);
  });
  renderExp();
}

expSearch.addEventListener('input', renderExp);

function renderExp() {
  const q = expSearch.value.trim().toLowerCase();
  expResults.innerHTML = '';

  const nodes = expActiveNode ? [expActiveNode] : Object.keys(expDb).sort();
  let totalSigs = 0;
  let visibleSigs = 0;

  nodes.forEach(node => {
    const msgs = expDb[node] || [];
    msgs.forEach(m => {
      const matchingSignals = m.signals.filter(s =>
        !q ||
        s.name.toLowerCase().includes(q) ||
        m.name.toLowerCase().includes(q)
      );

      totalSigs += m.signals.length;

      if (matchingSignals.length === 0) return;
      visibleSigs += matchingSignals.length;

      const section = document.createElement('div');
      section.className = 'exp-msg-section';

      const header = document.createElement('div');
      header.className = 'msg-header';

      const nameEl = document.createElement('span');
      nameEl.className = 'msg-name';
      nameEl.textContent = m.name;

      const idEl = document.createElement('span');
      idEl.className = 'msg-id';
      idEl.textContent = `0x${m.id.toString(16).toUpperCase().padStart(3,'0')}`;

      const nodeTag = document.createElement('span');
      nodeTag.className = 'exp-node-tag';
      nodeTag.textContent = node;

      header.append(nameEl, idEl, nodeTag);
      section.appendChild(header);

      matchingSignals.forEach(s => {
        const row = document.createElement('div');
        row.className = 'exp-sig-row';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'exp-sig-name';
        nameSpan.textContent = s.name;

        const unitsSpan = document.createElement('span');
        unitsSpan.className = 'exp-sig-units';
        unitsSpan.textContent = s.units || '';

        const valuesSpan = document.createElement('span');
        valuesSpan.className = 'exp-sig-values';
        if (s.values.length) {
          valuesSpan.textContent = s.values.join(' · ');
        }

        row.append(nameSpan, unitsSpan, valuesSpan);
        section.appendChild(row);
      });

      expResults.appendChild(section);
    });
  });

  if (expResults.children.length === 0) {
    expResults.innerHTML = `<div class="placeholder" style="height:100%"><div>No signals match "${expSearch.value}"</div></div>`;
    expCount.textContent = '';
  } else {
    expCount.textContent = q
      ? `${visibleSigs.toLocaleString()} / ${totalSigs.toLocaleString()} signals`
      : `${totalSigs.toLocaleString()} signals`;
  }
}

// ===========================================================
// RAW FRAMES TAB
// ===========================================================
(function () {
  const WS_RAW_URL     = `ws://${location.host}/ws-raw`;
  const RECONNECT_MS   = 1500;
  const BYTE_FLASH_MS  = 200;
  const BIT_FLASH_MS   = 200;
  const RATE_WINDOW_MS = 1000; // rolling window for rate calc

  const rawIdFilter    = document.getElementById('raw-id-filter');
  const rawClearBtn    = document.getElementById('raw-clear-btn');
  const rawFreezeBtn   = document.getElementById('raw-freeze-btn');
  const rawCardsGrid   = document.getElementById('raw-cards-grid');
  const rawStatusDot   = document.getElementById('raw-status-dot');
  const rawStatusText  = document.getElementById('raw-status-text');
  const rawIdList      = document.getElementById('raw-id-list');
  const rawShowAll     = document.getElementById('raw-show-all');
  const rawHideAll     = document.getElementById('raw-hide-all');

  let rawWs        = null;
  let frozen       = false;
  let filterText   = '';
  const hiddenIds  = new Set();  // CAN IDs the user has unchecked

  // Map: CAN ID (number) -> { card dom, prevData, timestamps[] for rate, byteEls[], bitEls[][] }
  const rawCards = new Map();

  // ---- WebSocket connection ----
  function connectRaw() {
    rawWs = new WebSocket(WS_RAW_URL);
    rawWs.onopen = () => {
      rawStatusDot.className = 'connected';
      rawStatusText.textContent = 'connected';
    };
    rawWs.onclose = () => {
      rawStatusDot.className = '';
      rawStatusText.textContent = 'reconnecting…';
      setTimeout(connectRaw, RECONNECT_MS);
    };
    rawWs.onerror = () => {
      rawStatusDot.className = 'error';
      rawStatusText.textContent = 'error';
    };
    rawWs.onmessage = (ev) => {
      if (frozen) return;
      let frame;
      try { frame = JSON.parse(ev.data); } catch { return; }
      handleRawFrame(frame);
    };
  }

  // ---- Frame handling ----
  function handleRawFrame(frame) {
    const { id, data, ts } = frame;
    if (!rawCards.has(id)) {
      createCard(id, data);
    }
    updateCard(id, data);
  }

  // ---- Card creation ----
  function createCard(id, data) {
    const idHex = '0x' + id.toString(16).toUpperCase().padStart(3, '0');

    const card = document.createElement('div');
    card.className = 'raw-card';
    card.dataset.rawId = id;

    const header = document.createElement('div');
    header.className = 'raw-card-header';

    const idEl = document.createElement('span');
    idEl.className = 'raw-card-id';
    idEl.textContent = idHex;

    const nameEl = document.createElement('span');
    nameEl.className = 'raw-card-name';
    // Leave name blank — backend sends no name on raw channel
    nameEl.textContent = '';

    const rateEl = document.createElement('span');
    rateEl.className = 'raw-card-rate';
    rateEl.textContent = '—';

    header.append(idEl, nameEl, rateEl);
    card.appendChild(header);

    const bytesRow = document.createElement('div');
    bytesRow.className = 'raw-bytes-row';

    const byteEls = [];
    const bitEls  = [];

    const len = data ? data.length : 8;
    for (let b = 0; b < len; b++) {
      const byteBox = document.createElement('div');
      byteBox.className = 'raw-byte-box';

      const hexEl = document.createElement('div');
      hexEl.className = 'raw-byte-hex';
      hexEl.textContent = '--';

      const bitsRow = document.createElement('div');
      bitsRow.className = 'raw-bits-row';

      const bits = [];
      for (let bit = 7; bit >= 0; bit--) {
        const sq = document.createElement('div');
        sq.className = 'raw-bit';
        bitsRow.appendChild(sq);
        bits.push(sq);
      }

      byteBox.append(hexEl, bitsRow);
      bytesRow.appendChild(byteBox);
      byteEls.push({ box: byteBox, hexEl });
      bitEls.push(bits); // bits[0] = MSB (bit 7), bits[7] = LSB (bit 0)
    }

    card.appendChild(bytesRow);

    // Insert card in sorted order by CAN ID
    const existing = [...rawCardsGrid.querySelectorAll('.raw-card')];
    let inserted = false;
    for (const el of existing) {
      if (parseInt(el.dataset.rawId, 10) > id) {
        rawCardsGrid.insertBefore(card, el);
        inserted = true;
        break;
      }
    }
    if (!inserted) rawCardsGrid.appendChild(card);

    // Sidebar entry
    const row = document.createElement('div');
    row.className = 'raw-id-row';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = true;
    cb.addEventListener('change', () => {
      if (cb.checked) hiddenIds.delete(id);
      else hiddenIds.add(id);
      applyRawFilter();
    });

    const lbl = document.createElement('span');
    lbl.className = 'raw-id-row-label';
    lbl.textContent = idHex;

    const sidebarRate = document.createElement('span');
    sidebarRate.className = 'raw-id-row-rate';
    sidebarRate.textContent = '';

    row.append(cb, lbl, sidebarRate);
    row.addEventListener('click', (e) => {
      if (e.target === cb) return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });

    // Insert in sorted order
    const existingRows = [...rawIdList.querySelectorAll('.raw-id-row')];
    let rowInserted = false;
    for (const el of existingRows) {
      if (parseInt(el.dataset.rawId, 10) > id) {
        rawIdList.insertBefore(row, el);
        rowInserted = true;
        break;
      }
    }
    if (!rowInserted) rawIdList.appendChild(row);
    row.dataset.rawId = id;

    rawCards.set(id, {
      card,
      rateEl,
      sidebarRate,
      byteEls,
      bitEls,
      prevData: null,
      timestamps: [],
    });

    applyRawFilter();
  }

  // ---- Card update ----
  function updateCard(id, data) {
    const state = rawCards.get(id);
    if (!state) return;

    // Rate tracking
    const now = performance.now();
    state.timestamps.push(now);
    // Prune old timestamps outside the window
    const cutoff = now - RATE_WINDOW_MS;
    while (state.timestamps.length && state.timestamps[0] < cutoff) {
      state.timestamps.shift();
    }
    const rate = state.timestamps.length;
    state.rateEl.textContent = `${rate}/s`;
    state.sidebarRate.textContent = `${rate}/s`;

    const prev = state.prevData;

    for (let b = 0; b < data.length; b++) {
      const val = data[b];
      const prevVal = prev ? prev[b] : null;
      const byteChanged = prevVal === null || val !== prevVal;

      const { box, hexEl } = state.byteEls[b];
      hexEl.textContent = val.toString(16).toUpperCase().padStart(2, '0');

      if (byteChanged) {
        // Flash byte box yellow
        box.classList.remove('byte-flash');
        void box.offsetWidth; // reflow to restart animation
        box.classList.add('byte-flash');
        setTimeout(() => box.classList.remove('byte-flash'), BYTE_FLASH_MS);
      }

      // Update bits (MSB = bit 7 = index 0 in our array)
      const bits = state.bitEls[b];
      for (let bit = 7; bit >= 0; bit--) {
        const bitIdx = 7 - bit; // 0 = MSB
        const sq = bits[bitIdx];
        const isOn = (val >> bit) & 1;
        const wasOn = prev ? (prev[b] >> bit) & 1 : -1;
        const bitChanged = wasOn !== isOn;

        sq.classList.toggle('on', !!isOn);

        if (bitChanged) {
          sq.classList.remove('bit-flash');
          void sq.offsetWidth;
          sq.classList.add('bit-flash');
          setTimeout(() => sq.classList.remove('bit-flash'), BIT_FLASH_MS);
        }
      }
    }

    state.prevData = data.slice();
  }

  // ---- Filter ----
  function applyRawFilter() {
    const f = filterText.trim().toLowerCase().replace(/^0x/, '');
    rawCards.forEach((state, id) => {
      const idHex = id.toString(16).toLowerCase();
      const matchesText = !f || idHex.includes(f);
      const show = matchesText && !hiddenIds.has(id);
      state.card.style.display = show ? '' : 'none';
    });
  }

  rawIdFilter.addEventListener('input', () => {
    filterText = rawIdFilter.value;
    applyRawFilter();
  });

  rawClearBtn.addEventListener('click', () => {
    rawCards.clear();
    hiddenIds.clear();
    rawCardsGrid.innerHTML = '';
    rawIdList.innerHTML = '';
  });

  rawShowAll.addEventListener('click', () => {
    hiddenIds.clear();
    rawIdList.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = true);
    applyRawFilter();
  });

  rawHideAll.addEventListener('click', () => {
    rawCards.forEach((_, id) => hiddenIds.add(id));
    rawIdList.querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    applyRawFilter();
  });

  rawFreezeBtn.addEventListener('click', () => {
    frozen = !frozen;
    rawFreezeBtn.classList.toggle('active', frozen);
    rawFreezeBtn.textContent = frozen ? 'Unfreeze' : 'Freeze';
  });

  // Connect when the Raw tab is first activated (lazy), but also connect eagerly
  // so rate data starts accumulating. We connect on first tab activation.
  let rawConnected = false;

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.tab === 'raw' && !rawConnected) {
        rawConnected = true;
        connectRaw();
      }
    });
  });
})();
